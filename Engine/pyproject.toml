[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "avril-transit-search"
version = "3.0.0"
description = "Evidence-preserving, cross-platform transit-candidate search for TESS light curves"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{name = "Avril contributors"}]
keywords = ["astronomy", "TESS", "transit", "exoplanet", "BLS", "CUDA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=2.0,<2.4",
  "scipy>=1.13,<2",
  "astropy>=7.0,<8.0",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "lightkurve==2.6.0",
  "astroquery>=0.4.9,<0.5",
  "numba>=0.62,<0.63",
  "exovetter==0.0.16",
  "tess-point>=0.9.5,<1",
]

[project.optional-dependencies]
scout = [
  "transitleastsquares==2.0.4",
]
cuda12 = [
  "cupy-cuda12x>=13.4,<14",
  "pycuda>=2025.1,<2027",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
  "wheel>=0.44",
]

[project.scripts]
avril = "avril.cli:main"

[project.urls]
Documentation = "https://github.com/Avril-Exoplanet/Avril#readme"
Issues = "https://github.com/Avril-Exoplanet/Avril/issues"

[tool.setuptools]
py-modules = [
  "run_avril_v3_science_batch",
  "run_avril_v3_threshold_round",
  "run_avril_v3_science_finalize",
  "run_vlora_cuda_vote_experiment",
  "run_vlora_vote_experiment",
  "run_vlora_vote_harmonic_finalize",
  "run_vlora_vote_rational_finalize",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["avril*", "vlora*", "multiplanet_trial*"]
namespaces = true
exclude = [
  "multiplanet_trial.results*",
  "multiplanet_trial.results_v02*",
]

[tool.setuptools.package-data]
vlora = ["assets/*.sh"]
"multiplanet_trial.live_web" = ["native/*.cpp", "testdata/*.json"]

[tool.pytest.ini_options]
testpaths = ["avril", "multiplanet_trial/live_web"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["apps", "data", "multiplanet_trial/results*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
