    <style>
      .bg{fill:#fff}.ink{fill:#20252a}.muted{fill:#657078}.title{font:500 34px 'Helvetica Neue',Arial,sans-serif;letter-spacing:-.5px}.kicker{font:600 12px 'Helvetica Neue',Arial,sans-serif;letter-spacing:2px}.section{font:500 24px Georgia,'Times New Roman',serif}.h{font:600 14px 'Helvetica Neue',Arial,sans-serif}.label{font:500 12px 'Helvetica Neue',Arial,sans-serif}.small{font:400 10.5px 'Helvetica Neue',Arial,sans-serif}.mono{font:500 10px 'SFMono-Regular',Menlo,monospace;letter-spacing:.2px}.box{stroke:#242a2e;stroke-width:1.35;rx:9}.thin{fill:none;stroke:#20252a;stroke-width:1.35}.flow{fill:none;stroke:#20252a;stroke-width:1.55;marker-end:url(#arrow)}.dash{fill:none;stroke:#41484d;stroke-width:1.25;stroke-dasharray:8 6}.grid{stroke:#d8dde0;stroke-width:.8}.curve{fill:none;stroke:#2f8f63;stroke-width:2}.transit{fill:none;stroke:#2176ae;stroke-width:2.4}.candidate{fill:none;stroke:#c83243;stroke-width:2.4}
    </style>
